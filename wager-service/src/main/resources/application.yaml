spring:
    application:
        name: wager-service

    datasource:
        url: jdbc:postgresql://localhost:5432/wager_db
        username: postgres
        password: password
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update # TODO change later to 'validate'
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: wager-service
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            properties:
                spring:
                    json:
                        use.type.headers: false
                        trusted:
                            packages: com.wagerpro.wagerservice.infrastructure.kafka.event
                        value.default.type: com.wagerpro.wagerservice.infrastructure.kafka.event.MatchStatusChangedEvent

    data:
        redis:
            host: localhost
            port: 6379

    cache:
        type: redis
        redis:
            cache-null-values: false
            use-key-prefix: true

server:
    port: 8083

security:
    jwt:
        # Development-only secret. Always override JWT_SECRET outside local development.
        secret: ${JWT_SECRET:V2FnZXJQcm9EZXZlbG9wbWVudFNlY3JldEtleUNoYW5nZU1lMjAyNg==}
        expiration-ms: ${JWT_EXPIRATION_MS:43200000}

app:
    kafka:
        #enabled: ${KAFKA_ENABLED:false}
        topic:
            match-status-changed: match-status-changed

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: never
    info:
        env:
            enabled: false

info:
    app:
        name: WagerPro Wager Service
        description: wager management, bets and transactions
        version: 0.0.1-SNAPSHOT

logging:
    level:
        root: INFO
        com.wagerpro.wagerservice.infrastructure: WARN
        hibernate: WARN

    file:
        name: logs/wager-pro.log

services:
    user-service:
        url: http://localhost:8081/api/v1/users
    catalog-service:
        url: ${CATALOG_SERVICE_URL:http://localhost:8082/api/v1/}
