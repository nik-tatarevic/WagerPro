spring:
    application:
        name: wager-service

    datasource:
        url: jdbc:postgresql://localhost:5432/wager_db
        username: postgres
        password: password
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        listener:
            auto-startup: false
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            group-id: wager-service-group
            acks: all
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            group-id: wager-service-group
            acks: all
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
    port: 8083

security:
    jwt:
        # Development-only secret. Always override JWT_SECRET outside local development.
        secret: ${JWT_SECRET:V2FnZXJQcm9EZXZlbG9wbWVudFNlY3JldEtleUNoYW5nZU1lMjAyNg==}
        expiration-ms: ${JWT_EXPIRATION_MS:10800000}

app:
    kafka:
        enabled: ${KAFKA_ENABLED:false}

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: never
    info:
        env:
            enabled: false

info:
    app:
        name: WagerPro Wager Service
        description: User management and authentication microservice
        version: 0.0.1-SNAPSHOT

logging:
    level:
        com.wagerpro.userservice: DEBUG

services:
    user-service:
        url: http://localhost:8081/api/v1/users
    catalog-service:
        url: ${CATALOG_SERVICE_URL:http://localhost:8082/api/v1/}
