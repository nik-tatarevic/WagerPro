spring:
    application:
        name: catalog-service

    datasource:
        url: jdbc:postgresql://localhost:5432/catalog_db
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update # TODO change later to 'validate'
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

    flyway:
        enabled: true
        locations: classpath:db/migration

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer

    data:
        redis:
            host: localhost
            port: 6379

    cache:
        type: redis
        redis:
            cache-null-values: false
            use-key-prefix: true

server:
    port: 8082

security:
    jwt:
        # Development-only secret. Always override JWT_SECRET outside local development.
        secret: ${JWT_SECRET:V2FnZXJQcm9EZXZlbG9wbWVudFNlY3JldEtleUNoYW5nZU1lMjAyNg==}
        expiration-ms: ${JWT_EXPIRATION_MS:43200000}

app:
    kafka:
        enabled: true
        topic:
            match-status-changed: match-status-changed

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: never
    info:
        env:
            enabled: false

info:
    app:
        name: WagerPro Catalog Service
        description: All about matches and odds
        version: 0.0.1-SNAPSHOT

logging:
    level:
        root: INFO
        com.wagerpro.catalogservice.infrastructure: WARN
        hibernate: WARN

    file:
        name: logs/wager-pro.log
